# Autoscaling for every bingo workload: ONE mechanism, KEDA (keda.sh/v1alpha1 ScaledObject). Production only; the
# test environment applies nothing here (every workload then runs 1 pod).
#
# One ScaledObject per workload. KEDA creates and owns its HPA (keda-hpa-<name>); the HPA takes the MAXIMUM of
# the triggers:
#   cpu    - the load signal of every workload (utilisation against the pod's CPU request);
#   cron   - the evening floor (18:30-01:15 Asia/Manila, time zone set in the trigger, independent of the nodes):
#            pods are started before the ramp, so rebalances and node scale-out happen before the traffic;
#   kafka  - consumer lag, for the Kafka consumers.
# minReplicaCount / maxReplicaCount and the cron floor are the only numbers that change between stages. Unlike the
# old HPA + CronHPA pair, re-applying this file never resets a scaled-out workload (the floor lives in the trigger).
# Paydays and events: raise the cron desiredReplicas (or minReplicaCount) the day before, see capacity-1m.md.
#
# Values per stage (peak concurrent players, docs/go-live.md §3) as min / evening floor / max. The file carries
# the 50k column; edit the three numbers of a workload when moving up a stage.
#                            50k            100k           1M
#   bingo-wallet             3 /  6 / 12    4 / 10 / 20    20 / 85 / 160   max = DB connection ceiling
#   bingo-game-integration   3 /  6 / 12    4 / 10 / 20    20 / 85 / 160
#   bingo-gateway            2 /  3 /  6    3 /  5 / 10    10 / 42 /  80
#   bingo-user               2 /  2 /  4    2 /  3 /  6     6 / 16 /  30
#   bingo-lobby              2 /  2 /  4    2 /  3 /  6     6 / 16 /  30
#   bingo-payment            2 /  2 /  4    2 /  3 /  6     3 /  8 /  15
#   bingo-bet-record         2 /  4 /  8    3 /  6 / 12    12 / 32 /  64   max <= 192 partitions / 3 threads
#   bingo-turnover           2 /  2 /  4    2 /  3 /  6     8 / 16 /  32   max <= 96 / 3
#   bingo-promotion          2 /  2 /  4    2 /  3 /  6     8 / 16 /  32   max <= 96 / 3
#   bingo-risk               2 /  - /  3    2 /  - /  4     2 /  - /   8
#   bingo-kyc                2 /  - /  3    2 /  - /  4     2 /  - /  10
#   bingo-reconcile          2 /  - /  2    2 /  - /  2     2 /  - /   2   scheduled jobs only
# DB connections: a pod opens one pool per shard database (max DB_POOL_SIZE, 2 idle), so an instance holding k of
# the 16 databases sees up to pods x k x DB_POOL_SIZE connections: 50k 12 x 16 x 8 = 1,536; 100k 20 x 8 x 8 = 1,280;
# 1M 160 x 1 x 8 = 1,280. Keep it below ~70% of max_connections when changing any of the three numbers.
#
# Installation: KEDA is NOT a CCE add-on, install it with Helm:
#     helm repo add kedacore https://kedacore.github.io/charts
#     helm install keda kedacore/keda --namespace keda --create-namespace --version <chart for your k8s>
#   Pick the KEDA version from its compatibility matrix (e.g. KEDA 2.21 -> Kubernetes 1.34-1.36, 2.18 -> 1.31-1.33).
#   Images come from ghcr.io; mirror them to SWR if the nodes have no internet egress.
#   Only ONE APIService may serve external.metrics.k8s.io per cluster - check
#     kubectl get apiservice v1beta1.external.metrics.k8s.io
#   before installing (it must end up pointing at keda-operator-metrics-apiserver).
#   The cpu triggers need the resource metrics API (CCE add-on "Kubernetes Metrics Server", or the cloud-native
#   monitoring add-on's adapter) and pod CPU requests (set in the manifests).
# Checked against the KEDA 2.21 docs (ScaledObject spec, apache-kafka, cpu and cron scalers).
#
# Kafka replica math:
#   - lagThreshold is the target lag PER POD (metricType AverageValue): desired = total group lag / lagThreshold.
#   - The Kafka scaler caps desired replicas at the partition count assuming ONE consumer per pod; our pods run 3
#     listener threads, hence max = partitions / 3.
#   - offsetResetPolicy must match spring.kafka.consumer.auto-offset-reset (earliest).
#   - Every scale step is a consumer-group rebalance, so consumer scale-up is stepped (+50% / +8 pods per 30s);
#     static membership (group.instance.id = POD_NAME) + CooperativeStickyAssignor, see docs/capacity-1m.md.
# Consumer groups (from the @KafkaListener annotations):
#   bingo-bet-record          WalletTxnConsumer               topic bingo.wallet.txn
#   bingo-turnover            turnover RoundSettledListener   topic bingo.round.settled
#   bingo-promotion-validbet  promotion RoundSettledListener  topic bingo.round.settled
---
# DMS for Kafka, SASL_SSL listener (private network port 9093 - verify in the instance's connection info).
# Credentials: Secret keda-dms-kafka (secrets-example.yaml), a DEDICATED read-only DMS user.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: dms-kafka-sasl-ssl
  namespace: bingo
spec:
  secretTargetRef:
    - parameter: sasl
      name: keda-dms-kafka
      key: sasl
    - parameter: username
      name: keda-dms-kafka
      key: username
    - parameter: password
      name: keda-dms-kafka
      key: password
    - parameter: tls
      name: keda-dms-kafka
      key: tls
    - parameter: ca
      name: keda-dms-kafka
      key: ca
---
# bingo-wallet: CPU 50% (latency matters more than utilisation). maxReplicaCount is the DB connection ceiling.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bingo-wallet
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: bingo-wallet
  minReplicaCount: 3
  maxReplicaCount: 12
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 10
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 600
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
    - type: cron
      metadata:
        timezone: Asia/Manila
        start: "30 18 * * *"
        end: "15 1 * * *"
        desiredReplicas: "6"
---
