# bingo-bet-record: builds game_round from bingo.wallet.txn and publishes bingo.round.settled.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bingo-bet-record
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: bingo-bet-record
  minReplicaCount: 2
  maxReplicaCount: 8
  fallback:                          # Kafka metrics unavailable 4x in a row -> hold this many (cpu still works)
    failureThreshold: 4
    replicas: 4
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          selectPolicy: Max
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
            - type: Pods
              value: 8
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 600
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: kafka
      authenticationRef:
        name: dms-kafka-sasl-ssl
      metadata:
        bootstrapServers: "__DMS_KAFKA_SASL_BROKERS__"   # e.g. 192.168.0.11:9093,192.168.0.12:9093,192.168.0.13:9093
        consumerGroup: bingo-bet-record
        topic: bingo.wallet.txn
        lagThreshold: "20000"
        offsetResetPolicy: earliest
        allowIdleConsumers: "false"
        # verify: DMS certificates are not issued for the broker IPs (DMS tells Java clients to disable hostname
        # verification). If the scaler logs an x509 hostname error, set "true": traffic stays encrypted inside
        # the VPC but the broker identity is no longer checked.
        unsafeSsl: "false"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"                  # throughput-bound consumer: higher utilisation than the online tier
    - type: cron
      metadata:
        timezone: Asia/Manila
        start: "30 18 * * *"
        end: "15 1 * * *"
        desiredReplicas: "4"
---
