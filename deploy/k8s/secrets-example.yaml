# EXAMPLE ONLY - placeholder values. Real secrets are NEVER committed to this repository.
#
# Production: secrets live in Huawei DEW / CSMS and are synchronised into the cluster by the CCE add-on
# "CCE Secrets Manager for DEW" (dew-provider, Secrets Store CSI driver). See the SecretProviderClass sketch at
# the end of this file. Use this file only for a throw-away test cluster:  kubectl apply -f secrets-example.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: bingo-common-secret
  namespace: bingo
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME"
  NACOS_USERNAME: "bingo-app"          # dedicated Nacos user with read-only access to the namespace
  NACOS_PASSWORD: "CHANGE_ME"
  XXL_JOB_TOKEN: "CHANGE_ME"           # must equal xxl.job.accessToken of xxl-job-admin
---
# One DB account per service, granted on its own schema only.
apiVersion: v1
kind: Secret
metadata:
  name: bingo-wallet-db
  namespace: bingo
type: Opaque
stringData:
  DB_USER: "bingo_wallet"
  DB_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: bingo-game-integration-db
  namespace: bingo
type: Opaque
stringData:
  DB_USER: "bingo_game"
  DB_PASSWORD: "CHANGE_ME"
# Repeat for bingo-user-db, bingo-lobby-db, bingo-bet-record-db, bingo-payment-db, bingo-risk-db,
# bingo-promotion-db, bingo-reconcile-db, bingo-turnover-db and bingo-kyc-db (referenced by service-template.yaml
# as <service>-db).
#
# bingo-kyc also reads DEW/CSMS secrets through the CSMS add-on mount (/mnt/csms), referenced from its config table:
#   bingo-runpod-api-key        RunPod API key
#   bingo-runpod-webhook-token  random token (>= 32 chars) appended to the RunPod webhook URL
# and uses the node IAM agency for OBS (bucket bingo-kyc, private); no OBS keys in the cluster.
---
# Gateway waiting room: HMAC key for queue tickets and admission passes (bingo.gateway.admission.pass-secret).
# >= 32 random characters, e.g. `openssl rand -base64 48`. Rotating it invalidates the passes of queued players.
apiVersion: v1
kind: Secret
metadata:
  name: bingo-gateway-secret
  namespace: bingo
type: Opaque
stringData:
  ADMISSION_PASS_SECRET: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
---
# KEDA Kafka lag scaler -> DMS for Kafka over SASL_SSL (TriggerAuthentication dms-kafka-sasl-ssl in
# autoscaling-keda.yaml). Read by the KEDA operator, not by any bingo pod. Use a dedicated DMS user that can
# only read (subscribe) bingo.wallet.txn, bingo.round.settled and bingo.provider.bet.
apiVersion: v1
kind: Secret
metadata:
  name: keda-dms-kafka
  namespace: bingo
type: Opaque
stringData:
  sasl: "scram_sha512"                 # KEDA values: plaintext (= SASL/PLAIN) | scram_sha256 | scram_sha512
  username: "keda-lag-reader"
  password: "CHANGE_ME"
  tls: "enable"
  ca: |                                # PEM CA certificate from the DMS console (Connection -> SSL certificate)
    -----BEGIN CERTIFICATE-----
    CHANGE_ME
    -----END CERTIFICATE-----

