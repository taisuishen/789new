# EXAMPLE ONLY - placeholder values. Real secrets are NEVER committed to this repository.
#
# TEST ENVIRONMENT: plain Kubernetes Secrets. Copy this file OUTSIDE the repository, replace every CHANGE_ME, then
#   kubectl apply -f <copy>
# PRODUCTION: the same Secret names and keys are synced from DEW / CSMS by the CSI driver (dew-secrets.yaml,
# dew-patch.yaml); do not create them by hand there.
#
# Generate random values with e.g. `openssl rand -base64 48` (>= 32 characters where noted).
---
# Env of every bingo pod (envFrom). NACOS_USERNAME (bingo-app) is in 02-common-config.yaml; that Nacos user needs
# READ + WRITE on the namespace (registering an instance is a write).
apiVersion: v1
kind: Secret
metadata:
  name: bingo-common-secret
  namespace: bingo
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME"
  NACOS_PASSWORD: "CHANGE_ME"
  XXL_JOB_TOKEN: "CHANGE_ME"           # >= 32 chars; must equal XXL_JOB_TOKEN in xxl-job-admin-secret
---
# One DB account per service, granted on its own schema only (sharded services: wildcard grant on their databases).
# Test environment: bingo-user-db, bingo-wallet-db, bingo-kyc-db. Later: bingo-game-integration-db, bingo-lobby-db,
# bingo-bet-record-db, bingo-payment-db, bingo-risk-db, bingo-promotion-db, bingo-reconcile-db, bingo-turnover-db.
apiVersion: v1
kind: Secret
metadata:
  name: bingo-wallet-db
  namespace: bingo
type: Opaque
stringData:
  DB_USER: "bingo_wallet"
  DB_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: bingo-user-db
  namespace: bingo
type: Opaque
stringData:
  DB_USER: "bingo_user"
  DB_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: bingo-kyc-db
  namespace: bingo
type: Opaque
stringData:
  DB_USER: "bingo_kyc"
  DB_PASSWORD: "CHANGE_ME"
---
# bingo-kyc env (service-template.yaml loads <service>-secret when it exists).
#   BINGO_RUNPOD_API_KEY: the config table keeps RunPodApiKey = dew:csms/bingo-runpod-api-key; without the DEW mount
#     SecretRefs falls back to the environment variable of the same name (upper case, '-' -> '_').
#   BINGO_RUNPOD_WEBHOOK_TOKEN: only once RunPodWebhookUrl is set (production, callback ELB).
#   OBS_ACCESS_KEY / OBS_SECRET_KEY: test cluster only, a dedicated IAM user allowed on the KYC bucket only.
#     Production leaves them out and uses the node IAM agency.
#   BINGO_PII_KEY_K1 / BINGO_PII_INDEX_KEY: field encryption of personal data (PiiCipher), the SAME two values as in
#     bingo-user-secret. K1 = `openssl rand -base64 32`; index key >= 32 random characters. Losing them = losing the
#     encrypted data: keep a copy in DEW (production) / the team vault (test).
apiVersion: v1
kind: Secret
metadata:
  name: bingo-kyc-secret
  namespace: bingo
type: Opaque
stringData:
  BINGO_RUNPOD_API_KEY: "CHANGE_ME"
  OBS_ACCESS_KEY: "CHANGE_ME"
  OBS_SECRET_KEY: "CHANGE_ME"
  BINGO_PII_KEY_K1: "CHANGE_ME_BASE64_OF_32_RANDOM_BYTES"
  BINGO_PII_INDEX_KEY: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
---
# bingo-user env: the PII keys (email / phone / birth date are stored encrypted, looked up by blind index).
apiVersion: v1
kind: Secret
metadata:
  name: bingo-user-secret
  namespace: bingo
type: Opaque
stringData:
  BINGO_PII_KEY_K1: "CHANGE_ME_BASE64_OF_32_RANDOM_BYTES"
  BINGO_PII_INDEX_KEY: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
---
# bingo-reconcile: read-only StarRocks account (bingo-reconcile-env.yaml has host / user). Production stage only.
apiVersion: v1
kind: Secret
metadata:
  name: bingo-reconcile-secret
  namespace: bingo
type: Opaque
stringData:
  DW_PASSWORD: "CHANGE_ME"
---
# Gateway waiting room: HMAC key for queue tickets and admission passes (bingo.gateway.admission.pass-secret).
# >= 32 random characters. Rotating it invalidates the passes of queued players.
apiVersion: v1
kind: Secret
metadata:
  name: bingo-gateway-secret
  namespace: bingo
type: Opaque
stringData:
  ADMISSION_PASS_SECRET: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS"
---
# xxl-job-admin (namespace bingo-infra, xxl-job-admin.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: xxl-job-admin-secret
  namespace: bingo-infra
type: Opaque
stringData:
  DB_USER: "xxl_job"
  DB_PASSWORD: "CHANGE_ME"
  XXL_JOB_TOKEN: "CHANGE_ME"           # same value as in bingo-common-secret
---
# Test environment Nacos (namespace bingo-infra, test/nacos-standalone.yaml).
#   NACOS_AUTH_TOKEN: Base64 of >= 32 random bytes (openssl rand -base64 32)
#   NACOS_AUTH_IDENTITY_KEY / _VALUE: any random strings (server-to-server identity)
apiVersion: v1
kind: Secret
metadata:
  name: nacos-secret
  namespace: bingo-infra
type: Opaque
stringData:
  NACOS_AUTH_TOKEN: "CHANGE_ME"
  NACOS_AUTH_IDENTITY_KEY: "CHANGE_ME"
  NACOS_AUTH_IDENTITY_VALUE: "CHANGE_ME"
---
# KEDA Kafka lag scaler -> DMS for Kafka over SASL_SSL (TriggerAuthentication dms-kafka-sasl-ssl in
# autoscaling.yaml). Read by the KEDA operator, not by any bingo pod. Use a dedicated DMS user that can
# only read (subscribe) bingo.wallet.txn, bingo.round.settled and bingo.provider.bet. Production only.
apiVersion: v1
kind: Secret
metadata:
  name: keda-dms-kafka
  namespace: bingo
type: Opaque
stringData:
  sasl: "scram_sha512"                 # KEDA values: plaintext (= SASL/PLAIN) | scram_sha256 | scram_sha512
  username: "keda-lag-reader"
  password: "CHANGE_ME"
  tls: "enable"
  ca: |                                # PEM CA certificate from the DMS console (Connection -> SSL certificate)
    -----BEGIN CERTIFICATE-----
    CHANGE_ME
    -----END CERTIFICATE-----
