# HPAs (autoscaling/v2) for the synchronous services rendered from service-template.yaml.
# bingo-wallet, bingo-game-integration and bingo-gateway carry their HPA in their own manifest; the Kafka
# consumers (bet-record, reconcile, turnover, promotion) are scaled by KEDA (autoscaling-keda.yaml) - a workload
# has EITHER an HPA OR a KEDA ScaledObject, never both (KEDA creates and owns its own HPA).
#
# Sizing (docs/capacity-1m.md): 4 vCPU / 8 GiB pods; min = off-peak baseline (~1/5 of peak, >= 1 per AZ),
# max = peak + ~50% headroom. CronHPA (autoscaling-cronhpa.yaml) raises minReplicas before the known peaks;
# the HPA alone decides the actual count. Do not re-apply this file during a peak window (it resets
# minReplicas to the baseline until the next CronHPA rule fires).
#
# Behaviour: scale up fast (100% or +N pods per 15s, short stabilisation), scale down slowly (5-10 min
# stabilisation, at most 10% per minute).
---
# bingo-user: login / session / game-token issuing. Peak ~20 pods (login storm at the start of the evening
# peak is the driver; the gateway waiting room caps admissions per second).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bingo-user
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: bingo-user
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
# bingo-lobby: game list / categories (mostly served from CDN + Caffeine), pre-launch checks. Peak ~20 pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bingo-lobby
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: bingo-lobby
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
