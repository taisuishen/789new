# PRODUCTION: secrets from Huawei DEW / CSMS through the CCE add-on "CCE Secrets Manager for DEW" (dew-provider,
# Secrets Store CSI driver). The test environment uses plain Kubernetes Secrets instead (secrets-example.yaml) and
# applies neither this file nor dew-patch.yaml.
#
# How it fits together (one path for every secret):
#   1. Every secret is a CSMS secret holding ONE plain-text value (no JSON, no jmesPath), named as below.
#   2. Each workload mounts two CSI volumes (dew-patch.yaml):
#        bingo-common    -> /mnt/csms-common   syncs Kubernetes Secret bingo-common-secret (env of every pod)
#        <service>       -> /mnt/csms          syncs <service>-db (DB_USER / DB_PASSWORD) and, where listed,
#                                              <service>-secret; files here are read by "dew:csms/<name>"
#                                              references (SecretRefs, default mount path /mnt/csms)
#      The Kubernetes Secrets exist only while at least one pod mounts the SecretProviderClass that syncs them, so
#      the manifests keep reading them exactly as on the test cluster (envFrom / secretKeyRef).
#   3. Each workload runs as its own ServiceAccount; the annotation cce.io/dew-resource lists the CSMS secrets that
#      ServiceAccount may read (the add-on refuses anything else).
# verify for your add-on version: provider name "cce", objectType "csms", the ServiceAccount annotation, and that
# secret rotation (add-on parameter) re-syncs the Kubernetes Secrets. Rotating a value = new CSMS version + rolling
# restart of the workloads that read it (env is read at pod start).
#
# Render the per-service part like service-template.yaml (sed __SERVICE__ / __EXTRA_OBJECTS__), e.g.
#   sed -e 's/__SERVICE__/bingo-user/g' dew-secrets.yaml | kubectl apply -f -
# and add the service's extra objects (table below) to its SecretProviderClass and ServiceAccount annotation.
#
#   service                 extra CSMS secrets (files under /mnt/csms, or synced env)
#   bingo-gateway           bingo-admission-pass-secret -> Secret bingo-gateway-secret, key ADMISSION_PASS_SECRET
#                           (the gateway has no database: drop the two -db objects and the -db secretObject)
#   bingo-kyc               bingo-runpod-api-key, bingo-runpod-webhook-token (dew:csms/... in the config table),
#                           bingo-pii-key-k1, bingo-pii-index-key (PiiCipher, bingo.pii.*)
#   bingo-user              bingo-pii-key-k1, bingo-pii-index-key
#   bingo-game-integration  one per provider key, as referenced in Nacos bingo-game-integration.yaml
#                           (secret: dew:csms/<name>)
#   bingo-payment           one per channel key, as referenced in payment_channel.config
#   bingo-reconcile         bingo-reconcile-dw-password -> Secret bingo-reconcile-secret, key DW_PASSWORD (StarRocks)
---
# Shared by every bingo workload: Redis, Nacos and XXL-Job credentials.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bingo-common
  namespace: bingo
spec:
  provider: cce
  parameters:
    objects: |
      - objectName: "bingo-redis-password"
        objectType: "csms"
        objectVersion: "latest"
      - objectName: "bingo-nacos-app-password"
        objectType: "csms"
        objectVersion: "latest"
      - objectName: "bingo-xxl-job-token"
        objectType: "csms"
        objectVersion: "latest"
  secretObjects:
    - secretName: bingo-common-secret
      type: Opaque
      data:
        - objectName: bingo-redis-password
          key: REDIS_PASSWORD
        - objectName: bingo-nacos-app-password
          key: NACOS_PASSWORD
        - objectName: bingo-xxl-job-token
          key: XXL_JOB_TOKEN
---
# Per service (rendered with __SERVICE__). NACOS_USERNAME is not secret: set it in 02-common-config.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: __SERVICE__
  namespace: bingo
spec:
  provider: cce
  parameters:
    objects: |
      - objectName: "__SERVICE__-db-user"
        objectType: "csms"
        objectVersion: "latest"
      - objectName: "__SERVICE__-db-password"
        objectType: "csms"
        objectVersion: "latest"
  secretObjects:
    - secretName: __SERVICE__-db
      type: Opaque
      data:
        - objectName: __SERVICE__-db-user
          key: DB_USER
        - objectName: __SERVICE__-db-password
          key: DB_PASSWORD
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __SERVICE__
  namespace: bingo
  annotations:
    # every CSMS secret of BOTH SecretProviderClasses this workload mounts
    cce.io/dew-resource: '["bingo-redis-password","bingo-nacos-app-password","bingo-xxl-job-token","__SERVICE__-db-user","__SERVICE__-db-password"]'
automountServiceAccountToken: false
