# Paydays drive deposits: the payment floor is highest on payday evenings.
apiVersion: autoscaling.cce.io/v2alpha1
kind: CronHorizontalPodAutoscaler
metadata:
  name: bingo-payment
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: autoscaling/v1
    kind: HorizontalPodAutoscaler
    name: bingo-payment
  rules:
    - ruleName: weekend-day
      schedule: "0 10 * * 0,6"
      targetReplicas: 6
      disable: false
    - ruleName: payday-day
      schedule: "0 11 15,28-31 * *"
      targetReplicas: 6
      disable: false
    - ruleName: weekend-evening
      schedule: "25 18 * * 0,5,6"
      targetReplicas: 8
      disable: false
    - ruleName: weekday-evening
      schedule: "30 18 * * 1-4"
      targetReplicas: 6
      disable: false
    - ruleName: payday-evening
      schedule: "35 18 15,28-31 * *"
      targetReplicas: 10
      disable: false
    - ruleName: night-down
      schedule: "15 1 * * *"
      targetReplicas: 3
      disable: false
