# Scheduled (pre-emptive) scaling with CCE CronHPA for the known Philippine peaks. All times are UTC+8.
#
# Verified against https://support.huaweicloud.com/usermanual-cce/cce_10_0415.html :
#   - add-on "CCE容器弹性引擎" (CCE Container Elastic Engine, formerly cce-hpa-controller) >= 1.2.13;
#   - apiVersion autoscaling.cce.io/v2alpha1, kind CronHorizontalPodAutoscaler;
#     spec.scaleTargetRef = an HPA (documented with apiVersion autoscaling/v1) or a Deployment;
#     spec.rules[]: ruleName, schedule (5-field cron), targetReplicas, disable;
#   - at most 10 rules per policy, and rules must not have the same trigger time;
#   - when the target is an HPA, CronHPA rewrites the HPA's minReplicas (and maxReplicas only if targetReplicas
#     exceeds it) - the documented way to combine CronHPA with HPA; never target the workload directly while
#     an HPA exists (the two would overwrite each other's replica counts);
#   - NO time-zone field: "trigger times are calculated based on the node's time zone". CCE in Hong Kong
#     (ap-southeast-1) and Singapore (ap-southeast-3) is UTC+8 when nodes run on local time - check with
#     `date -R` on a node and `kubectl -n kube-system exec <customedhpa-controller pod> -- date`. If it prints
#     UTC, subtract 8 hours from every schedule (conversion table in docs/capacity-1m.md).
#
# verify:
#   - StatefulSet-backed HPAs: the docs only describe HPA -> Deployment. bingo-wallet, bingo-game-integration,
#     bingo-user, bingo-lobby and bingo-payment are StatefulSets. Raising the HPA's minReplicas is enough for the
#     HPA itself to scale the StatefulSet within one sync period; test it once on the cluster before production.
#   - day-of-week lists ("0,5,6") and day-of-month lists/ranges ("15,28-31"): standard cron syntax, the docs
#     only show "15 * * * *".
#
# How it composes (docs/capacity-1m.md "谁来设置 min/max"):
#   HPA        - the only thing that sets replicas (CPU), bounded by [minReplicas, maxReplicas].
#   CronHPA    - moves the HPA's minReplicas (the floor) at the times below. Every targetReplicas is <= the HPA's
#                maxReplicas, so maxReplicas (for the wallet: the DB connection ceiling) is never changed.
#   KEDA       - consumers only; CronHPA must never target keda-hpa-* objects.
#
# Rule set (a rule's floor stays in force until the next rule fires):
#   weekend-day      Sat/Sun          10:00   daytime floor (D)
#   payday-day       15th, 28th-31st  11:00   daytime floor (D)
#   weekend-evening  Fri/Sat/Sun      18:25   evening floor (W)        pre-warm 35 min before 19:00
#   weekday-evening  Mon-Thu          18:30   evening floor (E)        pre-warm 30 min before 19:00
#   payday-evening   15th, 28th-31st  18:35   peak floor (P)           fires after E/W so it wins on paydays
#   night-down       daily            01:15   back to baseline (B = the HPA's manifest minReplicas); the HPA
#                                             then scales down slowly (10%/min after its stabilisation window)
# "Last day of month" cannot be written in 5-field cron, so the 28th-31st all count as payday evenings (at most
# 3 extra pre-warmed evenings a month). Paydays moved to the previous business day (15th/30th on a weekend or
# holiday) and one-off events: add a temporary rule or raise minReplicas by hand, see the pre-event checklist.
# A manual floor (incident) is overwritten by the next rule - set disable: true on the rules while holding it.
#
# Floors per service (B / D / E / W / P, HPA max):
#   bingo-wallet            20 / 40 / 70 / 85 / 100   max 160
#   bingo-game-integration  20 / 40 / 70 / 85 / 100   max 160
#   bingo-gateway           10 / 20 / 35 / 42 /  50   max  80
#   bingo-user               6 /  9 / 14 / 16 /  20   max  30
#   bingo-lobby              6 /  9 / 14 / 16 /  20   max  30
#   bingo-payment            3 /  6 /  6 /  8 /  10   max  15
---
apiVersion: autoscaling.cce.io/v2alpha1
kind: CronHorizontalPodAutoscaler
metadata:
  name: bingo-wallet
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: autoscaling/v1
    kind: HorizontalPodAutoscaler
    name: bingo-wallet
  rules:
    - ruleName: weekend-day
      schedule: "0 10 * * 0,6"
      targetReplicas: 40
      disable: false
    - ruleName: payday-day
      schedule: "0 11 15,28-31 * *"
      targetReplicas: 40
      disable: false
    - ruleName: weekend-evening
      schedule: "25 18 * * 0,5,6"
      targetReplicas: 85
      disable: false
    - ruleName: weekday-evening
      schedule: "30 18 * * 1-4"
      targetReplicas: 70
      disable: false
    - ruleName: payday-evening
      schedule: "35 18 15,28-31 * *"
      targetReplicas: 100
      disable: false
    - ruleName: night-down
      schedule: "15 1 * * *"
      targetReplicas: 20
      disable: false
---
