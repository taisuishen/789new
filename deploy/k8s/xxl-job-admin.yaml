# XXL-Job admin (scheduler + console) in namespace bingo-infra (third-party image, runs as root; 00-namespace.yaml).
# It calls the executors on 9101..9111 in namespace bingo, allowed by allow-xxl-job-admin in 01-networkpolicy.yaml.
# Not exposed through any Ingress; open the console with
#   kubectl -n bingo-infra port-forward svc/xxl-job-admin 18081:8080     ->  http://127.0.0.1:18081/xxl-job-admin
# Change the default console account (admin / 123456) right after the first login.
#
# - Schema: the official v3.4.2 doc/db/tables_xxl_job.sql in database xxl_job on the shared TaurusDB instance
#   (deploy/README.md §2).
# - Image: mirror xuxueli/xxl-job-admin:3.4.2 into SWR (docker pull / tag / push).
# - Secret xxl-job-admin-secret (namespace bingo-infra): DB_USER, DB_PASSWORD, XXL_JOB_TOKEN (same value as
#   XXL_JOB_TOKEN in bingo-common-secret, which the executors use; they refuse to start without one).
# - Two replicas share the database (the admin coordinates through a lock table); cron expressions are evaluated
#   in UTC+8 (TZ and -Duser.timezone). Test environment: replicas 1.
# Replace __REGISTRY__ and __TAURUSDB_SHARED_HOST__ before applying.
---
apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin                # XXL_JOB_ADMIN=http://xxl-job-admin.bingo-infra:8080 in 02-common-config.yaml
  namespace: bingo-infra
  labels:
    app.kubernetes.io/name: xxl-job-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xxl-job-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  namespace: bingo-infra
  labels:
    app.kubernetes.io/name: xxl-job-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xxl-job-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xxl-job-admin
    spec:
      imagePullSecrets:
        - name: default-secret               # SWR pull secret created by CCE in every namespace
      nodeSelector:
        bingo.io/pool: general
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: xxl-job-admin
      containers:
        - name: app
          image: __REGISTRY__/xxl-job-admin:3.4.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Manila
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx512m -Duser.timezone=Asia/Manila"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://__TAURUSDB_SHARED_HOST__:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: xxl-job-admin-secret, key: DB_USER }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: xxl-job-admin-secret, key: DB_PASSWORD }
            - name: XXL_JOB_ACCESSTOKEN      # xxl.job.accessToken
              valueFrom:
                secretKeyRef: { name: xxl-job-admin-secret, key: XXL_JOB_TOKEN }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
