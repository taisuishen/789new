# Non-secret environment shared by every bingo-* pod (envFrom). Secrets: see secrets-example.yaml.
# DB_HOST / DB_USER / DB_PASSWORD / WORKER_ID are set per workload (bingo-wallet has its own TaurusDB instance).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bingo-common-env
  namespace: bingo
  labels:
    app.kubernetes.io/part-of: bingo
data:
  # Platform time zone: UTC+8 everywhere (Asia/Manila has no DST). TaurusDB parameter template must also set
  # time_zone = +08:00; the JDBC URLs force the session to +08:00 regardless.
  TZ: "Asia/Manila"
  DB_PORT: "3306"
  REDIS_HOST: "__DCS_REDIS_HOST__"              # DCS instance address
  REDIS_PORT: "6379"
  NACOS_ADDR: "__NACOS_ADDR__"                  # e.g. nacos-0.nacos:8848,nacos-1.nacos:8848,nacos-2.nacos:8848
  NACOS_NAMESPACE: "__NACOS_NAMESPACE_ID__"     # namespace ID (not name), e.g. prod
  NACOS_ENABLED: "true"
  KAFKA_SERVERS: "__DMS_KAFKA_BROKERS__"        # DMS for Kafka private addresses, e.g. 192.168.0.11:9092,192.168.0.12:9092,192.168.0.13:9092
  # xxl-job-admin must run in namespace bingo: it calls the executors on 9101..9109, which only accept in-namespace traffic.
  XXL_JOB_ADMIN: "http://xxl-job-admin:8080"
  # OpenTelemetry agent (baked into the image). The agent's default protocol is http/protobuf (port 4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: "__OTEL_COLLECTOR_ENDPOINT__"   # e.g. http://otel-collector.observability:4318
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  # 1M sizing: ~600k server requests/s (callbacks + wallet + player API) would be ~150k sampled spans/s at 10%
  # for the self-hosted tracing backend (Huawei APM is not offered in APAC). 1% head sampling; keep errors /
  # slow traces with tail sampling in the OTel collector if needed (docs/capacity-1m.md).
  OTEL_TRACES_SAMPLER_ARG: "0.01"
