# bingo-wallet - the heart of the platform: every bet, payout, deposit and withdrawal moves money here.
#
# Sizing for 1,000,000 concurrent players (docs/capacity-1m.md; estimates until confirmed by load tests):
#   ~250k wallet TPS at peak (design 400k) -> ~100 pods at peak, HPA 20..160, 4 vCPU / 8 GiB each.
#   Scaling: HPA on CPU (50%: latency matters more than utilisation) + CCE CronHPA pre-warming for the known
#   Philippine peaks (autoscaling-cronhpa.yaml).
#
# - Independent workload with its own HPA and PodDisruptionBudget; never co-deployed with anything else.
# - StatefulSet (not Deployment) for stable ordinals: WORKER_ID (snowflake worker id, 0..1023) comes from the
#   apps.kubernetes.io/pod-index label (Kubernetes >= 1.28), so every replica has a unique id, including pods
#   added by the HPA. A second cluster writing to the same database (DR / blue-green) must use a disjoint range,
#   e.g. spec.ordinals.start: 512 there (512 + maxReplicas 160 < 1024). No volumeClaimTemplates: the pods are
#   otherwise stateless.
# - Wallet DB: 1024 logical shards (hash of user_id) in 16 databases bingo_wallet_00..15 (64 shards each), at 1M
#   online one per TaurusDB instance (each 1 primary + 1 read replica in another AZ). Earlier, several databases
#   share an instance (all 16 point at the same host); whole databases move to new instances online (DRS), see the
#   wallet's application-sharding.yml. The shard -> database map never changes.
#   Instance addresses: ConfigMap bingo-wallet-shards below; the shard -> instance map belongs to the wallet
#   service configuration (Nacos), not to this manifest.
# - CONNECTION BUDGET (the reason maxReplicas is a hard ceiling):
#     every wallet pod holds ONE Hikari pool per physical TaurusDB instance (the logical shards living on that
#     instance share it), so
#       connections per TaurusDB primary = wallet pods x DB_POOL_SIZE
#       expected peak : 100 pods x 8 =   800
#       HPA ceiling   : 160 pods x 8 = 1,280   (+ Flink CDC, reconcile readers, DBA sessions)
#       per pod       :  16 instances x 8 = 128 connections
#     Keep "HPA ceiling" below ~70% of the instance's max_connections (verify the value for the chosen TaurusDB
#     spec / Serverless TCU floor). Raising maxReplicas or DB_POOL_SIZE means re-doing this sum.
#     A pool of 8 is plenty: one wallet op holds a connection for ~1-3 ms, i.e. ~150 TPS per pod per instance
#     needs < 1 connection on average; the pool only absorbs jitter.
# - The pod count is capped by the DB connection budget, so the compute for the full ceiling is known and is
#   pre-provisioned on reserved general-pool nodes.
# - Spread across availability zones (hard, maxSkew 2) and across nodes (soft).
# - TaurusDB failover: during a primary switchover the wallet fails fast (1s connection timeout, 3s socket
#   timeout) and bingo-game-integration answers providers with their "system error, retry" code; the provider
#   retries the same transaction id and the wallet's idempotency makes the retry safe (application level).
#   DB health is deliberately NOT part of the liveness/readiness groups, so a failover never restarts or
#   de-registers wallet pods.
# - Tomcat / JVM: server.tomcat.max-connections, server.tomcat.threads.*, accept-count and virtual threads
#   (spring.threads.virtual.enabled) are set in the application's own configuration, not here. With virtual
#   threads the request concurrency is bounded by max-connections and by the downstream pools (DB_POOL_SIZE),
#   not by a platform thread pool. The image caps the heap at 75% of the memory limit (6 GiB of 8 GiB).
---
apiVersion: v1
kind: Service
metadata:
  name: bingo-wallet-headless        # governing Service of the StatefulSet
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-wallet
    app.kubernetes.io/part-of: bingo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: bingo-wallet
  ports:
    - name: http
      port: 8102
      targetPort: http
    - name: xxl
      port: 9102
      targetPort: xxl
---
# Callers normally resolve instances through Nacos; this Service is for tooling and non-Nacos clients.
apiVersion: v1
kind: Service
metadata:
  name: bingo-wallet
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-wallet
    app.kubernetes.io/part-of: bingo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bingo-wallet
  ports:
    - name: http
      port: 8102
      targetPort: http
---
# Physical wallet shards: 16 TaurusDB instances (primary endpoints). 1024 logical shards are distributed over
# them by the wallet's shard map (64 logical shards per instance at 16 instances; instance counts that divide
# 1024 - 16, 32, 64 - keep the distribution even when shards are moved to new instances).
# The names are read by bingo-wallet-service/src/main/resources/application-sharding.yml (ds00..ds15, routes of
# 64 logical shards each). Routes and migrating shards are changed at runtime in Nacos (bingo-wallet.yaml), not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bingo-wallet-shards
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-wallet
    app.kubernetes.io/part-of: bingo
data:
  WALLET_DB_HOST_00: "__TAURUSDB_WALLET_DS0_HOST__"
  WALLET_DB_HOST_01: "__TAURUSDB_WALLET_DS1_HOST__"
  WALLET_DB_HOST_02: "__TAURUSDB_WALLET_DS2_HOST__"
  WALLET_DB_HOST_03: "__TAURUSDB_WALLET_DS3_HOST__"
  WALLET_DB_HOST_04: "__TAURUSDB_WALLET_DS4_HOST__"
  WALLET_DB_HOST_05: "__TAURUSDB_WALLET_DS5_HOST__"
  WALLET_DB_HOST_06: "__TAURUSDB_WALLET_DS6_HOST__"
  WALLET_DB_HOST_07: "__TAURUSDB_WALLET_DS7_HOST__"
  WALLET_DB_HOST_08: "__TAURUSDB_WALLET_DS8_HOST__"
  WALLET_DB_HOST_09: "__TAURUSDB_WALLET_DS9_HOST__"
  WALLET_DB_HOST_10: "__TAURUSDB_WALLET_DS10_HOST__"
  WALLET_DB_HOST_11: "__TAURUSDB_WALLET_DS11_HOST__"
  WALLET_DB_HOST_12: "__TAURUSDB_WALLET_DS12_HOST__"
  WALLET_DB_HOST_13: "__TAURUSDB_WALLET_DS13_HOST__"
  WALLET_DB_HOST_14: "__TAURUSDB_WALLET_DS14_HOST__"
  WALLET_DB_HOST_15: "__TAURUSDB_WALLET_DS15_HOST__"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bingo-wallet
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-wallet
    app.kubernetes.io/part-of: bingo
spec:
  serviceName: bingo-wallet-headless
  # replicas is owned by the HPA (minReplicas 20 = off-peak baseline). It is deliberately not set here:
  # re-applying a manifest that contains spec.replicas would reset a scaled-out wallet (e.g. 100 -> 20 pods)
  # in the middle of a peak. On first creation the HPA scales 1 -> 20 within one sync period (~15s).
  podManagementPolicy: Parallel      # ordinals are only used for WORKER_ID; start/stop pods in parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # verify: honoured only when the MaxUnavailableStatefulSet feature gate is enabled on the CCE cluster
      # version (otherwise the API server drops the field and pods are replaced one at a time - a 100-pod
      # rollout then takes ~2 hours; deploy off-peak).
      maxUnavailable: 10%
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: bingo-wallet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bingo-wallet
        app.kubernetes.io/part-of: bingo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8102"
        prometheus.io/path: /actuator/prometheus
    spec:
      priorityClassName: bingo-critical
      automountServiceAccountToken: false
      enableServiceLinks: false          # no *_SERVICE_HOST/*_PORT env vars leaking into Spring binding
      # preStop (15s) + Spring graceful shutdown (spring.lifecycle.timeout-per-shutdown-phase=20s) + margin
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # General node pool (label bingo.io/pool=general, spread over 3 AZs). Capacity for maxReplicas is reserved
      # there (docs/capacity-1m.md, node pools).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: bingo.io/pool
                    operator: In
                    values: [general]
      topologySpreadConstraints:
        # Hard zone spread. maxSkew 2 (not 1) gives some slack at 100+ pods; nodeTaintsPolicy Honor excludes
        # nodes of a failed AZ (tainted unreachable:NoSchedule), so losing an AZ does not block scale-up in the
        # remaining two. If one AZ merely runs out of capacity, scale-up elsewhere stops at +2 - watch for
        # Pending pods ("didn't match pod topology spread constraints") and add capacity in that AZ.
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-wallet
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-wallet
      containers:
        - name: app
          image: __REGISTRY__/bingo-wallet:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8102
            - name: xxl
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: bingo-common-env
            - configMapRef:
                name: bingo-wallet-shards
            - secretRef:
                name: bingo-common-secret
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['apps.kubernetes.io/pod-index']"
            # 1M sizing runs the sharded wallet: the "sharding" profile loads application-sharding.yml
            # (16 databases from the bingo-wallet-shards ConfigMap).
            - name: SPRING_PROFILES_ACTIVE
              value: "sharding"
            - name: DB_HOST
              value: "__TAURUSDB_WALLET_HOST__"     # only used without the sharding profile (single instance)
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bingo-wallet-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bingo-wallet-db
                  key: DB_PASSWORD
            # Pool size PER TaurusDB instance (see CONNECTION BUDGET in the header):
            #   connections per primary = wallet pods x DB_POOL_SIZE  (100 x 8 = 800 at peak, 160 x 8 = 1,280 max)
            # Read by bingo.shard.pool.max-pool-size (one Hikari pool of this size per shard database).
            - name: DB_POOL_SIZE
              value: "8"
            - name: XXL_JOB_EXECUTOR_PORT
              value: "9102"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: bingo-wallet
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=bingo,k8s.pod.name=$(POD_NAME)"
          resources:                         # requests == limits: Guaranteed QoS, last to be evicted
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36             # up to 3 minutes to start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while endpoints / Nacos subscribers / load-balancer caches drop this pod,
              # then SIGTERM starts Spring's graceful shutdown (in-flight requests complete).
              exec:
                command: ["sh", "-c", "sleep 15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: applogs                  # XXL-Job executor job logs (xxl.job.executor.log-path)
              mountPath: /data/applogs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: applogs
          emptyDir:
            sizeLimit: 1Gi
---
# HPA = the only thing that sets the wallet's replica count. CronHPA (autoscaling-cronhpa.yaml) only moves
# minReplicas (the floor) at known peak times; maxReplicas stays the DB-connection ceiling and no CronHPA
# target may exceed it (a target above maxReplicas would make CronHPA raise maxReplicas).
# Do not re-apply this HPA during a peak window: it resets minReplicas to 20 until the next CronHPA rule.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bingo-wallet
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: bingo-wallet
  minReplicas: 20                    # off-peak baseline (~1/5 of peak); >= 6 per AZ
  maxReplicas: 160                   # design capacity 400k TPS AND the DB connection ceiling (160 x 8 per primary)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 10
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
# Percentage so node drains (cluster autoscaler scale-down, node pool upgrades) finish in reasonable time at
# 100+ pods; 10% of peak is covered by the 50% CPU target headroom. Rounds up, so at least 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bingo-wallet
  namespace: bingo
spec:
  maxUnavailable: 10%
  selector:
    matchLabels:
      app.kubernetes.io/name: bingo-wallet
