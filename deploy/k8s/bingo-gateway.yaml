# bingo-gateway - the ONLY entry point for player traffic (ingress-player.yaml). It routes to the services via
# Nacos and must reject /internal/** (route predicate in the gateway itself; the ingress cannot filter it).
# Writes no rows, so a Deployment is fine (no WORKER_ID).
#
# Sizing for 1,000,000 concurrent players (docs/capacity-1m.md; estimates until confirmed by load tests):
#   ~100k player API QPS at peak (design 150k; static assets and the game list are served by the CDN)
#   -> ~50 pods at peak (~2k QPS per pod at 60% CPU), HPA 10..80, 4 vCPU / 8 GiB each.
#   Scaling: HPA on CPU + CCE CronHPA raising the floor before known peaks (autoscaling-cronhpa.yaml); the
#   cluster autoscaler adds nodes.
#   Beyond capacity the gateway queues new logins / game launches (waiting room,
#   bingo.gateway.admission.*); players already in a game are unaffected.
#
# Spring Cloud Gateway runs on Netty (WebFlux): server.tomcat.* does not apply; the event-loop count follows the
# CPU limit (4). Actuator runs on the separate management port 18080 (management.server.port), so probes and
# scraping use that port - it is not exposed through the Service / ELB.
---
# Backend of the player Ingress. ClusterIP works with a dedicated ELB on CCE Turbo (pass-through to pods);
# on a CCE standard cluster LoadBalancer Ingress backends must be NodePort - change type accordingly.
apiVersion: v1
kind: Service
metadata:
  name: bingo-gateway
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-gateway
    app.kubernetes.io/part-of: bingo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bingo-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bingo-gateway
  namespace: bingo
  labels:
    app.kubernetes.io/name: bingo-gateway
    app.kubernetes.io/part-of: bingo
spec:
  # replicas is owned by the HPA (minReplicas 10); not set here so a re-apply never shrinks a scaled-out tier.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: bingo-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bingo-gateway
        app.kubernetes.io/part-of: bingo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "18080"
        prometheus.io/path: /actuator/prometheus
    spec:
      priorityClassName: bingo-online
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # General node pool only.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: bingo.io/pool
                    operator: In
                    values: [general]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-gateway
      containers:
        - name: app
          image: __REGISTRY__/bingo-gateway:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: mgmt
              containerPort: 18080
          envFrom:
            - configMapRef:
                name: bingo-common-env
            - secretRef:
                name: bingo-common-secret
          env:
            - name: MANAGEMENT_PORT          # pinned so probes / scraping never drift from application.yml
              value: "18080"
            # Waiting room HMAC key for queue tickets / passes: identical on all gateway pods, >= 32 chars.
            # The gateway refuses to start without it while bingo.gateway.admission.enabled=true.
            - name: ADMISSION_PASS_SECRET
              valueFrom:
                secretKeyRef:
                  name: bingo-gateway-secret
                  key: ADMISSION_PASS_SECRET
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: bingo-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=bingo,k8s.pod.name=$(POD_NAME)"
          resources:                         # requests == limits: predictable HPA utilisation, Guaranteed QoS
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # let the ELB and the endpoints controller drop this pod before shutdown starts
              exec:
                command: ["sh", "-c", "sleep 15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
# The HPA sets the replica count; CronHPA (autoscaling-cronhpa.yaml) only moves minReplicas at known peaks.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bingo-gateway
  namespace: bingo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bingo-gateway
  minReplicas: 10                    # off-peak baseline (~1/5 of peak)
  maxReplicas: 80                    # design 150k QPS + headroom
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 6
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bingo-gateway
  namespace: bingo
spec:
  maxUnavailable: 15%
  selector:
    matchLabels:
      app.kubernetes.io/name: bingo-gateway
