# Network isolation (ingress direction; egress to TaurusDB/DCS/DMS/Nacos/StarRocks is not restricted).
#
# Default deny: a bingo pod accepts only the callers listed here. /internal/** endpoints are service-to-service
# only and NetworkPolicy is L4 (no paths), so the rule is "who may open a connection to whom":
#   - bingo-gateway may reach every service (it routes the player API and rejects /internal/** itself);
#   - service -> service exactly as the Feign clients declare it (@EnableFeignClients of each application):
#       bingo-wallet            <- user, game-integration, lobby, payment, promotion, risk
#       bingo-user              <- game-integration, lobby, bet-record, payment, promotion, turnover, kyc
#       bingo-lobby             <- game-integration, bet-record, reconcile
#       bingo-game-integration  <- lobby, bet-record, reconcile
#       bingo-payment           <- risk
#       bingo-turnover          <- risk
#     Adding a Feign client = adding the caller here, otherwise its calls time out.
#   - xxl-job-admin (namespace bingo-infra) -> the executor ports 9101..9111;
#   - Prometheus -> metrics ports; the two ELBs -> their edge pods only.
# The ELB ingresses only route / -> bingo-gateway, /callback/ -> bingo-game-integration and /notify/ -> bingo-payment
# (+ /callback/runpod/ -> bingo-kyc on 8443). No ingress ever routes /internal/**.
# Next step when needed: an internal service token (or mTLS) so the callee also knows WHICH service called.
#
# verify for your CCE version / network model: NetworkPolicy enforcement depends on it (container tunnel
# network, VPC network on newer versions, CCE Turbo with network policies enabled). Kubelet probes from the node
# are not affected by these rules on CCE.
---
# 0. Default deny for every pod in the namespace; the policies below add the allowed callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: bingo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 1. bingo-gateway -> the HTTP port of every service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: bingo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-gateway
      ports:
        - protocol: TCP
          port: 8101
          endPort: 8111
---
# 2. Service -> service (matrix in the header).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers-wallet
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bingo-wallet
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bingo-user, bingo-game-integration, bingo-lobby, bingo-payment, bingo-promotion, bingo-risk]
      ports:
        - protocol: TCP
          port: 8102
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers-user
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bingo-user
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bingo-game-integration, bingo-lobby, bingo-bet-record, bingo-payment, bingo-promotion,
                         bingo-turnover, bingo-kyc]
      ports:
        - protocol: TCP
          port: 8101
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers-lobby
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bingo-lobby
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bingo-game-integration, bingo-bet-record, bingo-reconcile]
      ports:
        - protocol: TCP
          port: 8104
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers-game-integration
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bingo-game-integration
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bingo-lobby, bingo-bet-record, bingo-reconcile]
      ports:
        - protocol: TCP
          port: 8103
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callers-payment-turnover
  namespace: bingo
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bingo-payment, bingo-turnover]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bingo-risk
      ports:
        - protocol: TCP
          port: 8106
        - protocol: TCP
          port: 8110
---
# 3. xxl-job-admin (namespace bingo-infra) -> XXL-Job executors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-xxl-job-admin
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: bingo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bingo-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: xxl-job-admin
      ports:
        - protocol: TCP
          port: 9101
          endPort: 9111
---
# 4. Prometheus scraping of /actuator/prometheus (application port; bingo-gateway serves actuator on its
#    separate management port 18080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: bingo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring   # verify: namespace of your Prometheus / CCE monitoring add-on
      ports:
        - protocol: TCP
          port: 8101
          endPort: 8111
        - protocol: TCP
          port: 18080          # bingo-gateway management port (management.server.port)
---
# 5. Player ELB -> bingo-gateway only.
# With a dedicated ELB in pass-through mode (CCE Turbo + ClusterIP backends) packets arrive from the ELB's
# backend subnet; with NodePort backends (CCE standard) they arrive from node IPs - adjust the CIDR accordingly.
# Test environment: the subnet of the single player ELB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-player-elb-to-gateway
  namespace: bingo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bingo-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: __PLAYER_ELB_SUBNET_CIDR__
      ports:
        - protocol: TCP
          port: 8080
---
# 6. Callback ELB -> bingo-game-integration (/callback/**), bingo-payment (/notify/**) and bingo-kyc (RunPod
#    webhooks /callback/runpod/**, on the ELB's separate 8443 listener).
# A different ELB (ideally in its own subnet) from the player ELB: player traffic can never reach these pods.
# Test environment without a callback ELB: do not apply this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-callback-elb
  namespace: bingo
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bingo-game-integration, bingo-payment, bingo-kyc]
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: __CALLBACK_ELB_SUBNET_CIDR__
      ports:
        - protocol: TCP
          port: 8103
        - protocol: TCP
          port: 8106
        - protocol: TCP
          port: 8111
---
# 7. bingo-infra (Nacos in the test environment, xxl-job-admin): reachable from the bingo namespace and from
#    itself only. xxl-job-admin's console is opened with kubectl port-forward (not affected by NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bingo-namespace-only
  namespace: bingo-infra
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bingo
        - podSelector: {}
