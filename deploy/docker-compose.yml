# Local development infrastructure ONLY - the bingo-* services run from the IDE on the host.
#
#   cd deploy
#   docker compose up -d
#
# Every port is bound to 127.0.0.1: these containers use development credentials and must not be reachable
# from the LAN. Credentials can be overridden through environment variables or a deploy/.env file.
#
#   host port  service
#   3306       MySQL 8.4 (root / ${MYSQL_ROOT_PASSWORD:-root}; app user bingo / bingo from sql/00_databases.sql)
#   6379       Redis 7.4
#
# Time zone: every container runs on UTC+8 (TZ=Asia/Manila, no DST); MySQL uses default-time-zone=+08:00.
#   8848/9848  Nacos 3.2 server HTTP / gRPC       18080  Nacos console (container 8080 would clash with bingo-gateway)
#   9092       Kafka 4.x (KRaft, single node)
#   18081      XXL-Job admin 3.4.2 (context path "/")

name: bingo-infra

services:

  mysql:
    image: mysql:8.4
    container_name: bingo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Manila
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=1000
      # 8.4 already defaults to log_bin=ON, binlog_format=ROW, binlog_row_image=FULL (what Flink CDC needs).
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # 00_databases.sql .. 11_kyc.sql (+ 90_xxl_job.sql, see README) run once, on an EMPTY data volume.
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP, which stays closed while the init scripts run on the temporary server.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4   # debian-based: ships tzdata, so TZ applies to log timestamps
    container_name: bingo-redis
    environment:
      TZ: Asia/Manila
      # Empty by default to match the services' default REDIS_PASSWORD; set it to exercise AUTH like DCS.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    # 3.2.4+: a reported unauthenticated user-management issue affects 3.0.0-3.2.3. Production Nacos must also be >= 3.2.4.
    # The 3.1.x client managed by Spring Cloud Alibaba 2025.1 talks to a 3.2 server.
    image: nacos/nacos-server:v3.2.4
    container_name: bingo-nacos
    environment:
      TZ: Asia/Manila
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # Auth on for SDK/Open API/gRPC too, so NACOS_USERNAME / NACOS_PASSWORD are exercised as in production.
      NACOS_AUTH_ENABLE: "true"
      # JWT signing key: Base64 of >= 32 bytes. DEV PLACEHOLDER - decodes to
      # "bingo-LOCAL-DEV-ONLY-nacos-jwt-secret-never-use-in-prod".
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-YmluZ28tTE9DQUwtREVWLU9OTFktbmFjb3Mtand0LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZA==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-bingo-dev-identity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-bingo-dev-identity-value}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "127.0.0.1:18080:8080"   # console; first visit asks to initialise the "nacos" admin password
      - "127.0.0.1:8848:8848"    # HTTP API
      - "127.0.0.1:9848:9848"    # gRPC (8848 + 1000), used by nacos-client 2.x/3.x
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    container_name: bingo-kafka
    environment:
      TZ: Asia/Manila
      KAFKA_OPTS: -Duser.timezone=Asia/Manila
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT_HOST -> services on the host (127.0.0.1:9092); PLAINTEXT -> other containers (kafka:19092).
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: qkDY0pf9e0rqMbIdP25O4w
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # Data is ephemeral (recreated with the container); kafka-init re-creates the topics on every "up".
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  # One-shot: creates the topics and exits. Data streams (key = userId), business events (key = order / biz no)
  # and their dead-letter topics (<topic>.DLT, same partition count: failed records keep their partition).
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: bingo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: Asia/Manila
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in bingo.wallet.txn bingo.round.settled bingo.provider.bet \
                 bingo.payment.deposit-succeeded bingo.payment.withdraw-requested bingo.payment.withdraw-finished \
                 bingo.promotion.bonus-granted \
                 bingo.payment.deposit-succeeded.DLT bingo.payment.withdraw-requested.DLT \
                 bingo.promotion.bonus-granted.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 12 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Needs the xxl_job schema: put the official v3.4.2 doc/db/tables_xxl_job.sql at deploy/sql/90_xxl_job.sql
  # before the first "up" (or import it manually, see README).
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: bingo-xxl-job-admin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Manila   # cron expressions of all jobs are evaluated in UTC+8
      JAVA_OPTS: -Xms256m -Xmx512m -Duser.timezone=Asia/Manila
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
        --spring.datasource.username=bingo
        --spring.datasource.password=bingo
        --xxl.job.accessToken=${XXL_JOB_TOKEN:-bingo-local-dev-xxl-token}
    extra_hosts:
      # lets the admin call executors running on the host (xxl.job.executor.address=http://host.docker.internal:<port>)
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  nacos-data:
