server:
  port: 8106
  shutdown: graceful

spring:
  application:
    name: bingo-payment
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import:
      - optional:nacos:bingo-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: BINGO
      config:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: BINGO
        file-extension: yaml
    openfeign:
      # pooled Apache HttpClient 5 (feign-hc5); sized for 1M online, see docs/capacity-1m.md
      httpclient:
        hc5:
          enabled: true
        max-connections: 500
        max-connections-per-route: 250
      client:
        # Per-client keys are the @FeignClient contextId (walletClient, userClient), not the service name.
        # Feign never retries: a timed-out wallet call is an unknown outcome, retried later with the same bizNo.
        config:
          default:
            connect-timeout: 500
            read-timeout: 2000
          walletClient:
            connect-timeout: 500
            read-timeout: 3000
          userClient:
            connect-timeout: 500
            read-timeout: 2000
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/bingo_payment?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&connectTimeout=1000&socketTimeout=5000&cachePrepStmts=true&useServerPrepStmts=false
    username: ${DB_USER:bingo}
    password: ${DB_PASSWORD:bingo}
    hikari:
      pool-name: payment-hikari
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 4
      connection-timeout: 1000
      validation-timeout: 500
      keepalive-time: 30000
      max-lifetime: 600000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:9092}
    producer:
      # the outbox relay waits for the broker: never lose an acknowledged business event
      acks: all
      properties:
        enable.idempotence: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
  global-config:
    banner: false

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:}
    access-token: ${XXL_JOB_TOKEN:}
    executor:
      appname: ${spring.application.name}
      port: 9106

bingo:
  mybatis:
    worker-id: ${WORKER_ID:-1}
  outbox:
    enabled: true
  payment:
    # day / week / month boundaries of the responsible-gaming deposit limits
    business-zone: "+08:00"
    deposit:
      recover-after: 5m
      expire-after: 2h
    withdraw:
      recover-after: 2m
      paying-alert-after: 24h
    mock-channel:
      # local development only; never enable in production
      enabled: ${PAYMENT_MOCK_CHANNEL_ENABLED:false}
      secret: ${PAYMENT_MOCK_CHANNEL_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-}]"
