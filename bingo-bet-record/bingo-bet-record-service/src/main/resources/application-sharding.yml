# Production bet-record: SPRING_PROFILES_ACTIVE=sharding
# Same user -> logical shard hash as the wallet (1024 logical shards) in 16 databases bingo_bet_record_00..15, which
# may share TaurusDB instances (with each other and with bingo_turnover_NN). At 1M online the ledger stream is
# ~250k events/s; one instance per database keeps each primary around 16k transactions/s.
# game_round / round_txn / provider_bet_record are sharded by user; bet_pull_checkpoint lives on ds00 (global).
# routes / migrating-shards are hot-reloaded from Nacos (bingo-bet-record.yaml). Databases move to other instances
# exactly as described in the wallet's application-sharding.yml (no Flink CDC here). During the DRS copy pause
# betRecordPartitionJob; during the cutover the consumer retries writes of migrating shards (partition blocked for
# seconds) and betRecordProviderPullJob fails its run without advancing the checkpoint.

bet-record-jdbc-params: useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&connectTimeout=1000&socketTimeout=5000&cachePrepStmts=true&useServerPrepStmts=false

bingo:
  shard:
    enabled: true
    logical-shards: 1024
    global-datasource: ds00
    pool:
      max-pool-size: ${DB_POOL_SIZE:8}
      min-idle: 2
    migrating-shards: []
    datasources:
      ds00:
        url: jdbc:mysql://${BET_RECORD_DB_HOST_00}:${DB_PORT:3306}/bingo_bet_record_00?${bet-record-jdbc-params}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
      ds01:
        url: jdbc:mysql://${BET_RECORD_DB_HOST_01}:${DB_PORT:3306}/bingo_bet_record_01?${bet-record-jdbc-params}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
